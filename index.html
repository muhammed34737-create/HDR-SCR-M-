<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDR SCRIM</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#08090d;
    color:white;
}
header{
    padding:25px 20px;
    text-align:center;
    background:#11131a;
    border-bottom:1px solid #272a35;
}
.logo{
    font-size:38px;
    font-weight:900;
    letter-spacing:6px;
}
.sub{
    color:#999;
    margin-top:6px;
}
.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}
.card{
    background:#11131a;
    border:1px solid #292d38;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}
.title{
    font-size:23px;
    font-weight:bold;
}
.info{
    color:#aaa;
    margin:8px 0 18px;
}
.slots{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}
.slot{
    border:1px solid #303542;
    background:#171a22;
    color:#eee;
    padding:16px 10px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}
.slot:hover{
    background:#20242e;
}
.slot.full{
    background:#28171a;
    color:#ff7777;
    cursor:not-allowed;
}
button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}
input{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border-radius:8px;
    border:1px solid #333846;
    background:#0b0c10;
    color:white;
}
label{
    color:#aaa;
    font-size:14px;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    padding:20px;
    overflow:auto;
}
.modal-box{
    max-width:500px;
    margin:40px auto;
    background:#11131a;
    border:1px solid #303542;
    border-radius:15px;
    padding:22px;
}
.close{
    text-align:right;
    color:#aaa;
    font-size:25px;
    cursor:pointer;
}
.success{
    display:none;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
    <div class="logo">HDR</div>
    <div class="sub">PUBG MOBILE SCRIMS</div>
</header>

<div class="container">

<div class="card">
    <div class="title">🏆 19:00 SCRIM</div>
    <div class="info">
        25 Takım • Squad<br>
        Ödül: 5.000₺<br>
        Haritalar: Erangel • Miramar • Sanhok
    </div>

    <div class="slots" id="slots"></div>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-box">

<div class="close" onclick="closeModal()">✕</div>

<h2 id="slotTitle">SLOT</h2>

<label>Takım Adı</label>
<input id="team" placeholder="Takım adını yaz">

<label>Kaptan PUBG ID</label>
<input id="p1" placeholder="PUBG ID">

<label>Oyuncu 2 PUBG ID</label>
<input id="p2" placeholder="PUBG ID">

<label>Oyuncu 3 PUBG ID</label>
<input id="p3" placeholder="PUBG ID">

<label>Oyuncu 4 PUBG ID</label>
<input id="p4" placeholder="PUBG ID">

<button onclick="takeSlot()">SLOTU AL</button>

<div class="success" id="success">
    <h2>✅ Slot Alındı!</h2>
    <p id="successText"></p>
</div>

</div>
</div>

<script>

let selectedSlot=null;

function loadSlots(){

    const slots=document.getElementById("slots");
    slots.innerHTML="";

    for(let i=1;i<=25;i++){

        let data=localStorage.getItem("hdr_slot_"+i);

        let div=document.createElement("div");
        div.className="slot";

        if(data){
            let team=JSON.parse(data).team;
            div.classList.add("full");
            div.innerHTML="SLOT "+String(i).padStart(2,"0")+"<br>🔴 "+team;
        }else{
            div.innerHTML="SLOT "+String(i).padStart(2,"0")+"<br>🟢 BOŞ";
            div.onclick=()=>openSlot(i);
        }

        slots.appendChild(div);
    }
}

function openSlot(slot){

    selectedSlot=slot;

    document.getElementById("slotTitle").innerText=
        "SLOT "+String(slot).padStart(2,"0");

    document.getElementById("modal").style.display="block";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

function takeSlot(){

    let team=document.getElementById("team").value.trim();
    let p1=document.getElementById("p1").value.trim();
    let p2=document.getElementById("p2").value.trim();
    let p3=document.getElementById("p3").value.trim();
    let p4=document.getElementById("p4").value.trim();

    if(!team || !p1 || !p2 || !p3 || !p4){
        alert("Lütfen bütün alanları doldur.");
        return;
    }

    let data={
        team:team,
        p1:p1,
        p2:p2,
        p3:p3,
        p4:p4
    };

    localStorage.setItem(
        "hdr_slot_"+selectedSlot,
        JSON.stringify(data)
    );

    document.getElementById("successText").innerText=
        team+" — Slot "+String(selectedSlot).padStart(2,"0");

    document.getElementById("success").style.display="block";

    loadSlots();

    setTimeout(()=>{
        closeModal();
        document.getElementById("success").style.display="none";
    },1500);
}

loadSlots();

</script>

</body>
</html>
